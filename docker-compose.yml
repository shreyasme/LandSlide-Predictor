version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - landslide-net

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://admin:password@mongodb:27017
      DB_NAME: landslide_predictor
      SECRET_KEY: dev-secret-key
      AWS_REGION: us-east-1
      S3_BUCKET: landslide-predictor-data
      SAGEMAKER_ENDPOINT: landslide-predictor-endpoint
    depends_on:
      - mongodb
    networks:
      - landslide-net
    volumes:
      - ./backend:/app

  # React Frontend (development)
  frontend:
    image: node:18
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    networks:
      - landslide-net

volumes:
  mongodb_data:

networks:
  landslide-net:
    driver: bridge
